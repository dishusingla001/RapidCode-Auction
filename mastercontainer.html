<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EraBid - Today's Top Bids</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 40px 20px;
    }

    .masterContainer {
      max-width: 1200px;
      margin: 0 auto;
      background: rgba(255, 255, 255, 0.95);
      border-radius: 20px;
      padding: 40px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
      backdrop-filter: blur(10px);
    }

    figcaption {
      font-size: 2.5rem;
      font-weight: 700;
      text-align: center;
      color: #333;
      margin-bottom: 40px;
      text-transform: uppercase;
      letter-spacing: 2px;
      position: relative;
    }

    figcaption::after {
      content: '';
      position: absolute;
      bottom: -10px;
      left: 50%;
      transform: translateX(-50%);
      width: 100px;
      height: 4px;
      background: linear-gradient(90deg, #667eea, #764ba2);
      border-radius: 2px;
    }

    .scroll-box {
      overflow: hidden;
      border-radius: 15px;
      background: #f8f9fa;
      padding: 20px;
      box-shadow: inset 0 4px 8px rgba(0, 0, 0, 0.1);
    }

    .scroll-container {
      display: flex;
      gap: 30px;
      overflow-x: auto;
      padding: 20px 0;
      scroll-behavior: smooth;
    }

    .scroll-container::-webkit-scrollbar {
      height: 8px;
    }

    .scroll-container::-webkit-scrollbar-track {
      background: #e9ecef;
      border-radius: 10px;
    }

    .scroll-container::-webkit-scrollbar-thumb {
      background: linear-gradient(90deg, #667eea, #764ba2);
      border-radius: 10px;
    }

    .scroll-container > div {
      min-width: 280px;
      background: white;
      border-radius: 15px;
      padding: 25px;
      text-align: center;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
      transition: all 0.3s ease;
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }

    .scroll-container > div::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
      transition: left 0.5s;
    }

    .scroll-container > div:hover::before {
      left: 100%;
    }

    .scroll-container > div:hover {
      transform: translateY(-10px) scale(1.02);
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
    }

    .scroll-container img {
      width: 180px;
      height: 180px;
      object-fit: cover;
      border-radius: 12px;
      margin-bottom: 20px;
      transition: transform 0.3s ease;
      border: 3px solid #e9ecef;
    }

    .scroll-container > div:hover img {
      transform: scale(1.1);
      border-color: #667eea;
    }

    .scroll-container p {
      font-size: 1.2rem;
      font-weight: 600;
      color: #333;
      margin: 0;
      text-transform: capitalize;
      letter-spacing: 0.5px;
    }

    .bid-price {
      font-size: 1.4rem;
      color: #e74c3c;
      font-weight: bold;
      margin-top: 10px;
    }

    .bid-status {
      display: inline-block;
      padding: 5px 15px;
      background: linear-gradient(45deg, #667eea, #764ba2);
      color: white;
      border-radius: 20px;
      font-size: 0.9rem;
      margin-top: 15px;
      font-weight: 500;
    }

    @media (max-width: 768px) {
      .masterContainer {
        padding: 20px;
        margin: 20px;
      }

      figcaption {
        font-size: 2rem;
      }

      .scroll-container > div {
        min-width: 240px;
        padding: 20px;
      }

      .scroll-container img {
        width: 150px;
        height: 150px;
      }
    }

    @media (max-width: 480px) {
      figcaption {
        font-size: 1.5rem;
      }

      .scroll-container > div {
        min-width: 200px;
        padding: 15px;
      }

      .scroll-container img {
        width: 120px;
        height: 120px;
      }
    }
  </style>
</head>
<body>
  <div class="masterContainer">
    <figcaption>Today's Top Bids</figcaption>
    <div class="scroll-box">
      <div class="scroll-container">
        <div>
          <img src="./Graphic designing/car.png" alt="1965 Luxury Car" />
          <p>1965 Luxury Car</p>
          <div class="bid-price">$45,000</div>
          <span class="bid-status">Live Auction</span>
        </div>
        <div>
          <img src="./Graphic designing/radio.png" alt="1960s Stereo" />
          <p>1960s Vintage Stereo</p>
          <div class="bid-price">$1,250</div>
          <span class="bid-status">Live Auction</span>
        </div>
        <div>
          <img src="./Graphic designing/watch.png" alt="Luxury Watch" />
          <p>Swiss Luxury Watch</p>
          <div class="bid-price">$8,900</div>
          <span class="bid-status">Live Auction</span>
        </div>
        <div>
          <img src="./Graphic designing/car.png" alt="Vintage Motorcycle" />
          <p>Classic Motorcycle</p>
          <div class="bid-price">$12,500</div>
          <span class="bid-status">Ending Soon</span>
        </div>
        <div>
          <img src="./Graphic designing/radio.png" alt="Antique Furniture" />
          <p>Antique Furniture Set</p>
          <div class="bid-price">$3,200</div>
          <span class="bid-status">Live Auction</span>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
